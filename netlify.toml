# Netlify configuration for the BurnoutAholics static archive.
#
# Netlify builds from the committed content/ and data/ directories — it does NOT
# regenerate them from the MySQL dump, because legacy/ is gitignored and never
# leaves your machine. That split is deliberate: the dump holds user emails,
# password hashes and private messages.
#
# So the deploy pipeline is only the last two steps of the local one:
#     hugo  →  pagefind
# If you change extraction logic, run ./scripts/build_content.sh locally and
# commit the regenerated content/ and data/.

[build]
  publish = "public"
  command = "hugo --gc && npx --yes pagefind@latest --site public"

# Preview and branch deploys must not build with the production baseURL, or the
# sitemap, RSS feed and canonical links on a preview would all point at the live
# site. $DEPLOY_PRIME_URL is the deploy's own address.
[context.deploy-preview.environment]
  # Keeps analytics off preview deploys — the partial is gated on
  # hugo.IsProduction.
  HUGO_ENV = "development"

[context.deploy-preview]
  command = "hugo --gc --baseURL $DEPLOY_PRIME_URL && npx --yes pagefind@latest --site public"

[context.branch-deploy.environment]
  # Keeps analytics off preview deploys — the partial is gated on
  # hugo.IsProduction.
  HUGO_ENV = "development"

[context.branch-deploy]
  command = "hugo --gc --baseURL $DEPLOY_PRIME_URL && npx --yes pagefind@latest --site public"

[build.environment]
  # Pin both: an unpinned Hugo will eventually ship a breaking change and the
  # archive will start failing to build years from now with nobody watching.
  HUGO_VERSION = "0.148.2"
  NODE_VERSION = "20"

# --- headers ---------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  # Content-addressed by path and effectively immutable — this archive is frozen.
  for = "/files/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# --- redirects -------------------------------------------------------------
# Path-specific rules live in static/_redirects, generated by
# scripts/gen_redirects.py (the .wmv → .mp4 map in particular). Rules here are
# the ones that are easier to read in TOML.

[[redirects]]
  # Drupal's front page was /node; the archive's is /.
  from = "/node"
  to = "/"
  status = 301

[[redirects]]
  # Removed deliberately, not lost: node 2120 was a "spammer directory" pairing
  # 86 email addresses and 31 IPs with public accusations; node 3639 was the
  # contact form, whose body was empty once the webform module went away.
  # 410 says "gone on purpose" — a 404 invites crawlers to keep asking.
  from = "/node/2120"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/node/3639"
  to = "/404.html"
  status = 410

[[redirects]]
  # Account pages cannot exist on a read-only archive. 410 tells search engines
  # the URL is intentionally gone, so they stop retrying — 404 implies "maybe
  # later".
  from = "/user/*"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/comment/reply/*"
  to = "/404.html"
  status = 410

[[redirects]]
  from = "/node/add/*"
  to = "/404.html"
  status = 410
