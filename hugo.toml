baseURL = "https://burnoutaholics.com/"
languageCode = "en"
title = "BurnoutAholics.com"
enableRobotsTXT = true

summaryLength = 40

[pagination]
  # Drupal's default listing length. Matching it keeps pager depth aligned with
  # the old site's ?page=N URLs.
  pagerSize = 10
  path = "page"

[permalinks]
  # Frontmatter carries `url: /node/N`, which wins. These are the fallbacks for
  # anything without one.
  blog = "/node/:slug/"
  story = "/node/:slug/"

[taxonomies]
  # Deliberately empty. Terms are served as explicit pages at their original
  # /taxonomy/term/<tid> paths (generated by scripts/extract_structure.py), so
  # Hugo's own taxonomy machinery would only add a duplicate /terms/ tree.

[markup.goldmark.renderer]
  unsafe = true          # never strip raw HTML

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[services.rss]
  # Caps the per-section feeds. The front-page feed at /rss.xml has its own
  # template (layouts/index.rss.xml) and its own limit; without this the section
  # feeds would each carry every page in the section.
  limit = 10

[mediaTypes."application/rss+xml"]
  suffixes = ["xml"]

[outputFormats.RSS]
  # The live site serves its feed at /rss.xml; old subscribers depend on it.
  baseName = "rss"
  mediaType = "application/rss+xml"

[module]
  # /files (92 MB of post images, avatars, the logo and the generated colour
  # scheme) now lives in static/files, copied there by scripts/collect_assets.py.
  # It used to be mounted straight from legacy/, which built fine locally but
  # would have deployed a site with no inline images: legacy/ is gitignored, so
  # a git-based deploy never sees it. The build no longer depends on legacy/.
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"

[params]
  # Empty this to remove the support block site-wide.
  buyMeACoffee = "https://buymeacoffee.com/xandvenk"
  siteName = "BurnoutAholics.com"
  slogan = "Feed your addiction!"
  logo = "/files/NewBALogo.png"
  favicon = "/files/garland_favicon.ico"
  archiveNotice = true
  # Google Analytics 4 measurement ID. Emptying this disables analytics
  # entirely — layouts/partials/analytics.html emits nothing without it.
  googleAnalytics = "G-QVP0827TEV"
